version: "3.8"

services:
  # ===================================================
  # Distributed Task Queue & Real-Time Event Bus
  # ===================================================
  redis:
    image: redis:7-alpine
    container_name: speedcode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===================================================
  # REST API Gateway & WebSocket Event Streamer
  # ===================================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: speedcode-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PORT=8080
      - MAX_QUEUE_DEPTH=500
    depends_on:
      redis:
        condition: service_healthy

  # ===================================================
  # Distributed Execution Worker Pool #1
  # ===================================================
  worker-pool-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: speedcode-worker-1
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CONCURRENCY=4
      - WORKER_ID=worker-node-1
    depends_on:
      redis:
        condition: service_healthy

  # ===================================================
  # Distributed Execution Worker Pool #2
  # ===================================================
  worker-pool-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: speedcode-worker-2
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CONCURRENCY=4
      - WORKER_ID=worker-node-2
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
