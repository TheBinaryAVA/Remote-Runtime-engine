apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedcode-api
  namespace: default
  labels:
    app: speedcode-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: speedcode-api
  template:
    metadata:
      labels:
        app: speedcode-api
    spec:
      containers:
        - name: api
          image: speedcode-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_URL
              value: "redis://speedcode-redis:6379/0"
            - name: PORT
              value: "8080"
            - name: MAX_QUEUE_DEPTH
              value: "1000"
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: speedcode-api
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: speedcode-api
